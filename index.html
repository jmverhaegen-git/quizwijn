<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wijnquiz – Deelnemer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ui-theme.css">
</head>
<body>

<div class="container">
    <h1 class="title">Wijnquiz – Deelnemer</h1>

    <h2>Huidige Ronde</h2>
    <p>Ronde: <span id="currentWineNumber">0</span></p>
    <p>Status: <span id="quizStatusText">wachten</span></p>

    <div id="wineInfo" class="hidden">
        <h2>Jouw keuze</h2>
        <label for="grapeSelect">Kies druif:</label>
        <select id="grapeSelect"></select>

        <button id="submitChoiceBtn">Bevestigen</button>
    </div>

    <h2>Score</h2>
    <p id="scoreValue">0</p>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
