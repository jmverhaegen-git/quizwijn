<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Wijnquiz – Quizmaster</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ui-theme.css">
</head>
<body>

<div class="container">
    <h1 class="title">Wijnquiz – Quizmaster</h1>

    <!-- Sectie 1: Druivenbeheer -->
    <h2>Druivensoorten</h2>

    <input type="hidden" id="optionId">

    <label>Naam druif:</label>
    <input id="optionInput" type="text">

    <button id="saveOptionBtn">Optie Opslaan / Wijzigen</button>

    <h3>Bulk toevoegen</h3>
    <textarea id="bulkOptionInput" rows="6" placeholder="Één druif per regel"></textarea>
    <button id="bulkSaveBtn">Bulk Opslaan</button>

    <h3>Exporteren</h3>
    <button id="exportBtn">Exporteer lijst</button>

    <h3>Huidige lijst</h3>
    <div id="optionListDisplay"></div>

    <hr>

    <!-- Sectie 2: Wijnen -->
    <h2>Wijnrondes</h2>

    <label>Naam druif (of kies):</label>
    <input id="wineNameInput" type="text">
    <select id="masterGrapeSelect"></select>

    <label>Jaar:</label>
    <input id="wineYearInput" type="number">

    <label>Notities:</label>
    <textarea id="wineNoteInput" rows="3"></textarea>

    <button id="addWineBtn">Wijn toevoegen</button>

    <h3>Rondes</h3>
    <div id="wineListDisplay"></div>

    <hr>

    <!-- Sectie 3: Controle -->
    <h2>Quiz Controle</h2>

    <p>Huidige ronde: <span id="currentWineNumber">0</span></p>
    <p>Status: <span id="quizStatusText">wachten</span></p>

    <button id="nextWineBtn">Volgende ronde vrijgeven</button>
</div>

<script type="module" src="quizmaster.js"></script>
</body>
</html>
