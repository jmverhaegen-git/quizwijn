<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quizmaster Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ui-theme.css">
    <script type="module" src="firebase.js"></script>
    <script type="module" src="quizmaster.js"></script>
</head>
<body>
<div class="container">
    <h1 class="title">🍷 Quizmaster Dashboard</h1>

    <section class="card">
        <h2>1. Beheer Dropdown-lijst</h2>
        <div class="setup-box">
            <input id="optionId" type="hidden">
            <input id="optionInput" type="text" placeholder="Naam wijnsoort/druif">
            <button id="saveOptionBtn">Optie Opslaan / Wijzigen</button>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <label>Bulk Invoer / Import</label>
            <textarea id="bulkOptionInput" placeholder="Typ/plak soorten (komma of nieuwe regel)..." style="width: 100%; height: 80px; padding: 10px; box-sizing: border-box; font-family: inherit;"></textarea>
            
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button id="bulkSaveBtn" style="background: #2c3e50; flex: 2;">Bulk Toevoegen</button>
                <button id="exportBtn" style="background: #6c757d; flex: 1;">Bestand Export</button>
                <button id="importFileBtn" style="background: #6c757d; flex: 1;">Bestand Import</button>
                <input type="file" id="fileInput" accept=".txt" style="display: none;">
            </div>
        </div>
        <div id="optionListDisplay" style="max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-top: 10px; border-radius: 5px;"></div>
    </section>

    <section class="card">
        <h2>2. Wijn per Ronde Instellen</h2>
        <div class="setup-box">
            <label>Kies uit lijst OF typ nieuw:</label>
            <select id="masterGrapeSelect"></select>
            <input id="wineNameInput" type="text" placeholder="Of typ hier een nieuwe soort...">
            
            <label>Jaartal</label>
            <input id="wineYearInput" type="number" placeholder="Bijv. 2022">
            
            <label>Opmerkingen</label>
            <textarea id="wineNoteInput" style="width: 100%; box-sizing: border-box; height: 60px; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; font-size: 1.1em;"></textarea>
            
            <button id="addWineBtn">Wijn Opslaan voor Ronde</button>
        </div>
        <div id="wineListDisplay" style="margin-top:15px;"></div>
    </section>

    <section class="card highlight">
        <h2>3. Live Besturing</h2>
        <p>Status: <strong id="quizStatusText">-</strong> | Ronde: <strong id="currentWineNumber">0</strong></p>
        <div style="display:flex; gap:10px;">
            <button id="prevWineBtn" style="background:#6c757d;">⬅️ Vorige</button>
            <button id="nextWineBtn" style="background:#28a745;">Volgende Vrijgeven ➡️</button>
        </div>
    </section>

    <section class="card">
        <h2>4. Resultaten</h2>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <button id="tempScoreBtn" style="background:#17a2b8;">Tussenstand</button>
            <button id="calcBtn" style="background:#5A0F0F;">🏁 Quiz Afsluiten</button>
        </div>
        <div id="scoreTable"></div>
    </section>

    <section class="card danger-zone" style="background: #fff5f5; border: 1px solid #feb2b2; margin-top: 30px;">
        <h2>⚠️ Data Beheer (Reset)</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button id="resetAnswersBtn" style="font-size: 0.9em; padding: 8px;">Wis Antwoorden</button>
            <button id="resetParticipantsBtn" style="font-size: 0.9em; padding: 8px;">Wis Deelnemers</button>
            <button id="resetWinesBtn" style="font-size: 0.9em; padding: 8px;">Wis Wijnrondes</button>
            <button id="resetOptionsBtn" style="font-size: 0.9em; padding: 8px;">Wis Dropdownlijst</button>
        </div>
    </section>
</div>
</body>
</html>
